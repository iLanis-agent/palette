<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palette - Color Harmony Generator</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:#fafafa; color:#1c1c22; min-height:100vh; padding-bottom:60px; }
  .wrap { max-width:760px; margin:0 auto; padding:20px 16px; }
  header { text-align:center; margin-bottom:14px; }
  header h1 { font-size:28px; letter-spacing:-.5px; }
  header a { color:#7c6cf0; font-size:12px; text-decoration:none; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:14px; align-items:center; }
  .mode { border:1.5px solid #ddd; background:#fff; border-radius:999px; padding:7px 13px; font-size:12.5px; cursor:pointer; color:#555; }
  .mode.on { border-color:#7c6cf0; background:#f0edff; color:#5340d6; font-weight:600; }
  #shuffle { border:none; background:#1c1c22; color:#fff; border-radius:999px; padding:10px 20px; font-size:13.5px; font-weight:600; cursor:pointer; }
  #strips { display:flex; height:340px; border-radius:18px; overflow:hidden; box-shadow:0 6px 24px rgba(0,0,0,.10); margin-bottom:8px; }
  .strip { flex:1; display:flex; flex-direction:column; justify-content:flex-end; padding:14px 10px; cursor:pointer; position:relative; transition:flex .2s; }
  .strip:hover { flex:1.4; }
  .strip .hex { font-weight:700; font-size:14px; font-variant-numeric:tabular-nums; }
  .strip .cr { font-size:10.5px; opacity:.85; margin-top:2px; line-height:1.4; }
  .strip .lk { position:absolute; top:12px; left:50%; transform:translateX(-50%); font-size:15px; opacity:.55; border:none; background:rgba(255,255,255,.25); border-radius:8px; width:30px; height:30px; cursor:pointer; }
  .strip .lk.locked { opacity:1; background:rgba(255,255,255,.55); }
  #toast { text-align:center; font-size:13px; color:#5340d6; height:20px; margin-bottom:10px; }
  .card { background:#fff; border:1px solid #e8e6e3; border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .lbl { font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:#999; margin-bottom:10px; }
  .srow { display:flex; gap:10px; align-items:center; padding:6px 0; }
  .srow .sw { width:34px; height:34px; border-radius:9px; flex-shrink:0; border:1px solid rgba(0,0,0,.08); }
  .srow .sx { font-weight:600; font-size:13.5px; min-width:70px; font-variant-numeric:tabular-nums; }
  .srow .rm { margin-left:auto; color:#bbb; background:none; border:none; cursor:pointer; font-size:15px; }
  .srow .rm:hover { color:#e33; }
  #emptyFav { color:#aaa; font-size:13px; }
  .hint { text-align:center; color:#aaa; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>&#127912; Palette</h1><a href="index.html">&larr; About</a></header>

  <div class="controls">
    <button class="mode on" data-m="analogous">Analogous</button>
    <button class="mode" data-m="complementary">Complementary</button>
    <button class="mode" data-m="triadic">Triadic</button>
    <button class="mode" data-m="mono">Monochrome</button>
    <button id="shuffle">Shuffle &#8635;</button>
  </div>

  <div id="strips"></div>
  <div id="toast"></div>
  <div class="hint">click a strip to copy its hex &middot; &#128274; to lock &middot; spacebar to shuffle</div>

  <div class="card" style="margin-top:16px">
    <div class="lbl">Saved palettes</div>
    <div id="favs"><div id="emptyFav">None yet - hit Save palette below.</div></div>
    <div style="margin-top:10px"><button class="mode" id="savePal">+ Save this palette</button></div>
  </div>
</div>

<script>
var MODES={
  analogous:function(h){ return [h-30, h-15, h, h+15, h+30]; },
  complementary:function(h){ return [h, h, h+180, h+180, h+30]; },
  triadic:function(h){ return [h, h, h+120, h+240, h+240]; },
  mono:function(h){ return [h, h, h, h, h]; }
};
var SATS={analogous:[72,68,74,68,72], complementary:[75,45,72,42,80], triadic:[72,40,68,64,42], mono:[0,0,0,0,0]};
var LITS={analogous:[62,48,38,52,66], complementary:[52,32,46,68,60], triadic:[55,30,52,60,36], mono:[82,64,48,32,18]};
function hsl(h,s,l){
  h=((h%360)+360)%360; s/=100; l/=100;
  var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs(((h/60)%2)-1)), m=l-c/2, r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
function toHex(rgb){ return '#'+rgb.map(function(v){return v.toString(16).padStart(2,'0');}).join('').toUpperCase(); }
function lum(rgb){
  var f=function(v){ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  return 0.2126*f(rgb[0])+0.7152*f(rgb[1])+0.0722*f(rgb[2]);
}
function contrast(a,b){
  var la=lum(a), lb=lum(b);
  if(la<lb){ var t=la; la=lb; lb=t; }
  return (la+0.05)/(lb+0.05);
}
function badge(r){ return r>=7?'AAA':r>=4.5?'AA':r>=3?'AA large':'low'; }
var state={ mode:'analogous', locks:[false,false,false,false,false], colors:[], favs:[] };
try{ var sv=JSON.parse(localStorage.getItem('palette-state')||'null'); if(sv){ state.mode=sv.mode||state.mode; state.colors=sv.colors||[]; state.locks=sv.locks||state.locks; state.favs=sv.favs||[]; } }catch(_){}
function save(){ try{ localStorage.setItem('palette-state', JSON.stringify({mode:state.mode, colors:state.colors, locks:state.locks, favs:state.favs})); }catch(_){}}
function genColor(i, baseH){
  var hs=MODES[state.mode](baseH);
  return hsl(hs[i], SATS[state.mode][i], LITS[state.mode][i]);
}
function shuffle(){
  var baseH=Math.floor(Math.random()*360);
  for(var i=0;i<5;i++){
    if(!state.locks[i] || !state.colors[i]) state.colors[i]=genColor(i, baseH);
  }
  save(); renderStrips();
}
if(state.colors.length!==5){ state.colors=[]; state.locks=[false,false,false,false,false]; shuffle(); }
function textOn(rgb){ return contrast(rgb,[255,255,255])>=contrast(rgb,[10,10,14]) ? '#fff' : '#1c1c22'; }
function $(id){ return document.getElementById(id); }
function renderStrips(){
  var h='';
  state.colors.forEach(function(rgb,i){
    var hex=toHex(rgb), fg=textOn(rgb);
    var cw=contrast(rgb,[255,255,255]), cb=contrast(rgb,[10,10,14]);
    h+='<div class="strip" data-i="'+i+'" style="background:'+hex+';color:'+fg+'">'+
      '<button class="lk'+(state.locks[i]?' locked':'')+'" data-i="'+i+'" title="lock">'+(state.locks[i]?'&#128274;':'&#128275;')+'</button>'+
      '<div class="hex">'+hex+'</div>'+
      '<div class="cr">on white '+cw.toFixed(1)+' &middot; '+badge(cw)+'<br>on black '+cb.toFixed(1)+' &middot; '+badge(cb)+'</div></div>';
  });
  $('strips').innerHTML=h;
  document.querySelectorAll('.strip').forEach(function(el){
    el.onclick=function(e){
      if(e.target.classList.contains('lk')) return;
      var hex=toHex(state.colors[parseInt(el.getAttribute('data-i'))]);
      copy(hex);
    };
  });
  document.querySelectorAll('.lk').forEach(function(b){
    b.onclick=function(){ var i=parseInt(b.getAttribute('data-i')); state.locks[i]=!state.locks[i]; save(); renderStrips(); };
  });
}
function copy(t){
  function done(){ $('toast').textContent=t+' copied'; setTimeout(function(){ $('toast').textContent=''; },1400); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, done); }
  else{ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){} ta.remove(); done(); }
}
function renderFavs(){
  if(!state.favs.length){ $('favs').innerHTML='<div id="emptyFav">None yet - hit Save palette below.</div>'; return; }
  var h='';
  state.favs.forEach(function(f,fi){
    h+='<div class="srow">'+f.map(function(c){ return '<div class="sw" style="background:'+toHex(c)+'"></div>'; }).join('')+
      '<button class="rm" data-i="'+fi+'">&times;</button></div>';
  });
  $('favs').innerHTML=h;
  document.querySelectorAll('.rm').forEach(function(b){
    b.onclick=function(){ state.favs.splice(parseInt(b.getAttribute('data-i')),1); save(); renderFavs(); };
  });
}
document.querySelectorAll('.mode[data-m]').forEach(function(b){
  b.onclick=function(){
    state.mode=b.getAttribute('data-m');
    document.querySelectorAll('.mode[data-m]').forEach(function(x){ x.classList.toggle('on', x===b); });
    state.locks=[false,false,false,false,false];
    shuffle();
  };
});
document.querySelector('.mode[data-m="'+state.mode+'"]').classList.add('on');
if(state.mode!=='analogous') document.querySelector('.mode[data-m="analogous"]').classList.remove('on');
$('shuffle').onclick=shuffle;
$('savePal').onclick=function(){ state.favs.unshift(state.colors.map(function(c){return c.slice();})); if(state.favs.length>12) state.favs.pop(); save(); renderFavs(); };
document.addEventListener('keydown',function(e){ if(e.code==='Space' && !e.repeat){ e.preventDefault(); shuffle(); } });
renderStrips(); renderFavs();
</script>
</body>
</html>
